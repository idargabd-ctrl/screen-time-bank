{% extends "base.html" %}
{% block title %}Родитель{% endblock %}

{% block body %}
<h1>Для родителя</h1>
<p class="muted">Снимки тетради, черновики заданий и сводка пилота.</p>

<form method="post" action="/parent/login" class="stack">
  {% if error %}
    <div class="note note--bad">{{ error }}</div>
  {% endif %}
  <label class="field">
    <span class="field__label">Пароль родителя</span>
    <input class="input" type="password" name="password" autofocus autocomplete="current-password">
  </label>
  <button class="btn btn--wide" type="submit">Войти</button>
</form>
{% endblock %}
