{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block body %}
<h1>Банк времени</h1>
<p class="muted">Решаешь задания — получаешь минуты на планшет.</p>

<form method="post" action="/login" class="stack">
  {% if error %}
    <div class="note note--bad">{{ error }}</div>
  {% endif %}
  <label class="field">
    <span class="field__label">Твой код</span>
    <input class="input input--num" type="password" name="pin" inputmode="numeric" autofocus
           autocomplete="off" enterkeyhint="go">
  </label>
  <button class="btn btn--wide btn--lg" type="submit">Войти</button>
</form>
{% endblock %}
